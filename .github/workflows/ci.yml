name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build and test (Node ${{ matrix.node-version }}, NestJS ${{ matrix.nestjs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        nestjs: [11]
        include:
          # NestJS 12 is ESM-only; Jest can only require() it on Node >= 24.9
          - node-version: 24
            nestjs: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Build
        run: pnpm run build --filter=@nestjs-modules/mailer

      - name: Use NestJS ${{ matrix.nestjs }}
        if: matrix.nestjs != 11
        run: >-
          pnpm --filter @nestjs-modules/mailer add -D
          @nestjs/common@^${{ matrix.nestjs }}
          @nestjs/core@^${{ matrix.nestjs }}
          @nestjs/testing@^${{ matrix.nestjs }}

      - name: Unit tests (100% coverage required)
        run: pnpm --filter @nestjs-modules/mailer run test:cov
        env:
          NODE_OPTIONS: ${{ matrix.nestjs == 12 && '--experimental-vm-modules' || '' }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # No pnpm cache: this job never installs, so the store path would not
          # exist and the post-job cache save would fail.
          node-version: 24

      - name: Audit dependencies
        run: pnpm audit --audit-level=low
