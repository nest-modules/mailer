name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build and test (Node ${{ matrix.node-version }}, NestJS ${{ matrix.nestjs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        nestjs: [11]
        include:
          # NestJS 12 (the dev default) is ESM-only; Jest can only load it on Node >= 24.9
          - node-version: 24
            nestjs: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Build
        run: pnpm run build --filter=@nestjs-modules/mailer

      - name: Use NestJS 11
        if: matrix.nestjs == 11
        run: >-
          pnpm --filter @nestjs-modules/mailer add -D
          @nestjs/common@^11
          @nestjs/core@^11
          @nestjs/testing@^11
          @nestjs/event-emitter@^3

      - name: Unit tests (100% coverage required)
        run: pnpm --filter @nestjs-modules/mailer run test:cov

      - name: Integration tests with the official @nestjs/mail
        run: pnpm --filter @nestjs-modules/mailer run test:interop

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No pnpm cache: this job never installs, so the store path would not
          # exist and the post-job cache save would fail.
          node-version: 24

      - name: Audit dependencies
        run: pnpm audit --audit-level=low
